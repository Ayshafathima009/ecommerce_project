<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" fill="none">
  <defs>
    <linearGradient id="siemeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="silverShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e2e8f0" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Automotive Hexagonal Wing Emblem -->
  <g transform="translate(15, 12)">
    <!-- Outer Shield / Hex -->
    <polygon points="32,4 60,18 60,48 32,62 4,48 4,18" fill="#090d16" stroke="url(#silverShine)" stroke-width="2.5" />
    <!-- Inner Speed Wing Angle -->
    <path d="M14,24 L32,15 L50,24 L42,28 L32,23 L22,28 Z" fill="url(#siemeBlue)" filter="url(#glow)" />
    <!-- Dynamic Chevron -->
    <path d="M18,36 L32,28 L46,36 L32,46 Z" fill="url(#silverShine)" />
    <!-- Center Core Point -->
    <circle cx="32" cy="33" r="3.5" fill="#38bdf8" />
  </g>

  <!-- Typography: MERAI -->
  <text x="95" y="48" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="34" letter-spacing="4.5" fill="url(#silverShine)">
    MERAI
  </text>

  <!-- Brand Sub-Text: SIEME DRIVE -->
  <text x="96" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10.5" letter-spacing="3.2" fill="#38bdf8">
    SIEME DRIVE
  </text>

  <!-- Vertical Divider Line -->
  <line x1="225" y1="26" x2="225" y2="64" stroke="#334155" stroke-width="1.5" />

  <!-- Engineered to Inspire tagline in logo lockup -->
  <text x="240" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="11" letter-spacing="1.2" fill="#94a3b8">
    ENGINEERED TO INSPIRE
  </text>
  <text x="240" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-weight="400" font-size="9" letter-spacing="1" fill="#64748b">
    AUTOMOTIVE INTELLIGENCE
  </text>
</svg>
